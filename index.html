<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東老闆專屬聚會</title>
    <!-- 引入 Firebase 雲端大腦 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        /* 字體與背景設定 */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            background-color: #f4f4f4; color: #005f20; margin: 0; padding: 0;
            display: flex; justify-content: center;
        }
        
        /* 載入畫面 */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #005f20; color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 20px; font-weight: bold; z-index: 9999;
        }
        .spinner { margin-top: 15px; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-container {
            width: 100%; max-width: 480px; background-color: #ffffff;
            min-height: 100vh; border-left: 3px solid #005f20; border-right: 3px solid #005f20;
            box-sizing: border-box; position: relative;
        }
        .header {
            background-color: #005f20; color: #ffffff; text-align: center;
            padding: 15px; font-size: 20px; font-weight: bold; letter-spacing: 2px;
        }
        /* 導覽列 */
        .nav-tabs { display: flex; background-color: #e0f0e5; border-bottom: 2px solid #005f20; overflow-x: auto; white-space: nowrap; }
        .nav-tab {
            flex: 1; text-align: center; padding: 12px 8px; font-size: 13px;
            font-weight: bold; cursor: pointer; color: #004415;
        }
        .nav-tab.active { background-color: #005f20; color: #ffffff; }
        .content { padding: 20px; }
        
        input, select, button, textarea {
            width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #005f20;
            border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit;
        }
        input[type="color"] { padding: 5px; height: 50px; cursor: pointer; }
        input[type="file"] { padding: 8px; font-size: 14px; }
        input[type="checkbox"], input[type="radio"] { width: auto; margin-right: 5px; transform: scale(1.2); }
        
        button { background-color: #005f20; color: #ffffff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #004415; }
        button.secondary { background-color: #ffffff; color: #005f20; }
        
        /* 公告牆樣式 */
        .announcement-board { background-color: #fffaf0; border: 2px dashed #d35400; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .announcement-title { color: #d35400; font-weight: bold; margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center;}
        .announcement-text { font-size: 14px; color: #333; line-height: 1.5; white-space: pre-wrap;}
        .edit-notice-btn { background: none; border: none; color: #d35400; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; width: auto; font-weight: normal;}

        /* 折疊卡片樣式 */
        .card { border: 2px dashed #005f20; border-radius: 8px; margin-bottom: 15px; background-color: #fafafa; }
        .card-summary { display: flex; align-items: center; justify-content: space-between; padding: 15px; cursor: pointer; }
        .card-summary-left { display: flex; align-items: center; flex: 1; min-width: 0; }
        .card-summary-right { font-size: 13px; color: #005f20; font-weight: bold; flex-shrink: 0; margin-left: 10px; }
        .card-details { padding: 0 15px 15px 15px; border-top: 1px dashed #ddd; margin-top: -5px; padding-top: 15px; position: relative;}
        
        .text-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #005f20; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
        .card-title { font-size: 16px; font-weight: bold; color: #005f20; padding-right: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
        .card-creator { font-size: 13px; color: #666; margin-top: 4px; }
        .badge { background-color: #005f20; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; display: inline-block; }
        .badge-poll { background-color: #ff9800; }
        .badge-post { background-color: #2196F3; }
        .badge-closed { background-color: #555; }
        
        /* 圖片與內文 */
        .post-image { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
        .post-text { font-size: 15px; color: #333; line-height: 1.5; margin-bottom: 10px; white-space: pre-wrap; }
        .post-input-area { background-color: #e0f0e5; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #005f20; }
        
        /* 刪除/操作按鈕 */
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
        .action-btn { background: none; border: none; padding: 5px; font-size: 14px; cursor: pointer; border-radius: 5px; width: auto; font-weight: normal; }
        .action-btn.delete { color: #d32f2f; }
        .action-btn.delete:hover { background-color: #ffebee; }
        .action-btn.close { color: #ff9800; }
        .action-btn.close:hover { background-color: #fff3e0; }
        
        /* 出席狀態區 */
        .attendance-group { display: flex; gap: 10px; margin-bottom: 15px; margin-top: 10px;}
        .attendance-btn { flex: 1; padding: 10px; font-size: 14px; }
        .attendance-btn.active-attend { background-color: #005f20; color: white; }
        .attendance-btn.active-absent { background-color: #d32f2f; color: white; border-color: #d32f2f; }
        
        /* 留言區 */
        .comment-section { border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px;}
        .comment-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .comment-item { background-color: #fff; padding: 8px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #eee; font-size: 14px; position: relative; padding-right: 30px;}
        .comment-delete-btn { position: absolute; right: 5px; top: 5px; background: none; color: #d32f2f; border: none; width: auto; padding: 2px 5px; font-size: 12px; cursor: pointer; }
        .comment-delete-btn:hover { background-color: #ffebee; border-radius: 3px; }
        .comment-input-group { display: flex; gap: 5px; }
        .comment-input-group input { margin: 0; flex: 1; }
        .comment-input-group button { width: auto; margin: 0; padding: 0 15px; white-space: nowrap; }

        /* 店休總覽 */
        .closure-day-row { display: flex; padding: 10px 0; border-bottom: 1px solid #eee; }
        .closure-day-label { width: 60px; font-weight: bold; color: #005f20; flex-shrink: 0;}
        .closure-day-list { color: #555; font-size: 14px; line-height: 1.5;}
        
        /* 電子會員卡 */
        .membership-card { color: white; border-radius: 12px; padding: 25px 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); margin-bottom: 20px; position: relative; overflow: hidden; transition: background 0.3s ease; }
        .membership-card::after { content: '台東開店人生'; position: absolute; font-size: 60px; color: rgba(255,255,255,0.06); top: 10px; right: -20px; font-weight: 900; line-height: 1; white-space: nowrap; }
        .member-tier-display { font-size: 24px; font-weight: bold; color: #ffd700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        .member-info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
        
        .custom-style-panel { background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .admin-panel { border: 2px solid #005f20; border-radius: 8px; padding: 15px; background-color: #fff; margin-bottom: 20px;}
        .admin-title { color: #005f20; font-weight: bold; margin-bottom: 15px; font-size: 18px; border-bottom: 1px dashed #005f20; padding-bottom: 10px;}
        
        /* 比例圖 */
        .ratio-bar { width: 100%; height: 10px; border-radius: 5px; background-color: #ddd; display: flex; overflow: hidden; margin-bottom: 5px; }
        .ratio-attend { background-color: #005f20; height: 100%; transition: width 0.3s; }
        .ratio-absent { background-color: #d32f2f; height: 100%; transition: width 0.3s; }
        .vote-bar-bg { background-color: #e0f0e5; height: 8px; border-radius: 4px; margin-top: 5px; }
        .vote-fill { background-color: #005f20; height: 100%; border-radius: 4px; transition: width 0.3s; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- 開機載入畫面 -->
<div id="loading-screen">
    <div>連線至雲端大腦中...</div>
    <div class="spinner"></div>
</div>

<div class="app-container hidden" id="main-app-wrapper">
    <div class="header">台東老闆專屬聚會</div>
    
    <div id="nav-section" class="nav-tabs hidden">
        <div class="nav-tab active" id="tab-home" onclick="switchTab('home')">首頁動態</div>
        <div class="nav-tab" id="tab-events" onclick="switchTab('events')">聚會報名</div>
        <div class="nav-tab" id="tab-polls" onclick="switchTab('polls')">投票區</div>
        <div class="nav-tab" id="tab-closures" onclick="switchTab('closures')">店休總覽</div>
        <div class="nav-tab" id="tab-card" onclick="switchTab('card')">會員卡</div>
    </div>

    <div class="content">
        <!-- 登入區 -->
        <div id="login-section" class="hidden">
            <h2>台東老闆專屬聚會</h2>
            <p style="font-size: 14px; color: #666;">首次登入需輸入邀請碼，已註冊的老闆只要輸入電話即可快速登入。</p>
            <label style="font-weight: bold; font-size: 14px;">手機號碼 (10碼)：</label>
            <input type="tel" id="phone-input" placeholder="例如: 0912345678" maxlength="10">
            <div id="invite-code-container">
                <label style="font-weight: bold; font-size: 14px; margin-top: 5px; display: block;">專屬邀請碼 <span style="color:#888; font-size:12px; font-weight:normal;">(已註冊免填)</span>：</label>
                <input type="text" id="invite-code-input" placeholder="初次加入請輸入邀請碼">
            </div>
            <button onclick="login()" style="margin-top: 15px;">進入系統</button>
        </div>

        <!-- 註冊區 -->
        <div id="profile-section" class="hidden">
            <h2>設定基本資料</h2>
            <p style="font-size: 14px; color: #666;">歡迎加入！請輸入您的稱呼，系統將為您建立專屬會員卡。</p>
            <input type="text" id="name-input" placeholder="請輸入您的稱呼或店名 (例: 王老闆)">
            <button onclick="saveProfile()" style="margin-top: 20px;">儲存並進入</button>
        </div>

        <!-- 主畫面容器 -->
        <div id="main-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display: flex; align-items: center;">
                    <div id="my-avatar" class="text-avatar" style="width:30px; height:30px; font-size:14px;"></div>
                    <span id="welcome-msg" style="font-weight:bold; color:#005f20;">歡迎！</span>
                </div>
                <button style="width: auto; padding: 5px 15px; font-size: 14px;" class="secondary" onclick="logout()">登出</button>
            </div>
            
            <!-- 首頁動態 -->
            <div id="home-view">
                <!-- 公告牆 -->
                <div id="announcement-board" class="announcement-board">
                    <div class="announcement-title">
                        <span>📌 老闆公告牆</span>
                        <span id="edit-notice-container"></span>
                    </div>
                    <div class="announcement-text" id="announcement-text-display">載入中...</div>
                </div>

                <div class="post-input-area">
                    <h4 style="margin: 0 0 10px 0; color: #005f20;">📷 分享動態</h4>
                    <textarea id="post-text-input" placeholder="跟大家分享今天的心情或照片..." style="height: 60px;"></textarea>
                    <input type="file" id="post-image-input" accept="image/*">
                    <button onclick="submitPost()">發佈動態</button>
                </div>
                <div id="home-list"></div>
            </div>

            <!-- 其他分頁 -->
            <div id="events-view" class="hidden"><button onclick="showCreateForm('event')">＋ 發起新聚會</button><hr style="border: 1px solid #005f20; margin: 20px 0;"><div id="events-list"></div></div>
            <div id="polls-view" class="hidden"><button onclick="showCreateForm('poll')">＋ 建立新投票</button><hr style="border: 1px solid #005f20; margin: 20px 0;"><div id="polls-list"></div></div>
            
            <!-- 店休總覽 -->
            <div id="closures-view" class="hidden">
                <h3 style="color: #005f20; border-bottom: 2px solid #005f20; padding-bottom: 5px;">📍 固定店休一覽</h3>
                <div class="card" id="regular-closures-list"></div>
                <h3 style="color: #d35400; border-bottom: 2px solid #d35400; padding-bottom: 5px; margin-top: 30px;">🏖️ 近期臨時特休</h3>
                <div class="card" id="temp-closures-list" style="border-color:#d35400; background-color:#fffaf0;"></div>
            </div>

            <!-- 會員卡與後台區塊 -->
            <div id="card-view" class="hidden">
                <div id="my-membership-card"></div>
                <div class="custom-style-panel">
                    <h4 style="margin-top:0; color:#005f20; border-bottom:1px solid #ccc; padding-bottom:8px;">📅 我的店休設定</h4>
                    <label style="font-size:14px; font-weight:bold;">固定公休日 (可複選)：</label>
                    <div style="margin: 10px 0; font-size:14px;" id="closed-days-checkboxes">
                        <label><input type="checkbox" value="一">一</label> <label><input type="checkbox" value="二">二</label>
                        <label><input type="checkbox" value="三">三</label> <label><input type="checkbox" value="四">四</label>
                        <label><input type="checkbox" value="五">五</label> <label><input type="checkbox" value="六">六</label>
                        <label><input type="checkbox" value="日">日</label>
                    </div>
                    <label style="font-size:14px; font-weight:bold; margin-top:10px; display:block;">新增臨時特休日期：</label>
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <input type="date" id="temp-close-date" style="margin:0;">
                        <button onclick="addTempCloseDate()" style="margin:0; width:auto; white-space:nowrap;">新增</button>
                    </div>
                    <div id="temp-close-list" style="margin-top:10px; font-size:13px; color:#555;"></div>
                    <button onclick="saveClosureSettings()" style="margin-top:15px; background-color:#d35400;">儲存店休設定</button>
                </div>
                <div class="custom-style-panel">
                    <h4 style="margin-top:0; color:#005f20; border-bottom:1px solid #ccc; padding-bottom:8px;">🎨 自訂會員卡風格</h4>
                    <label style="font-size:14px; font-weight:bold;">卡片主色調：</label><input type="color" id="card-color-picker" value="#005f20">
                    <label style="font-size:14px; font-weight:bold; margin-top:10px; display:block;">專屬表情符號 (Emoji)：</label>
                    <input type="text" id="card-emoji-input" placeholder="例如: 🦖 或 ☕" maxlength="2" value="✨">
                    <button onclick="saveCardStyle()" style="margin-top:15px;">儲存風格</button>
                </div>
                <div id="admin-panel-container"></div>
            </div>
        </div>

        <!-- 隱藏表單區 -->
        <div id="create-event-section" class="hidden">
            <h2>發起新聚會</h2>
            <input type="text" id="event-title" placeholder="聚會名稱 (例: 週末喝一杯)">
            <input type="text" id="event-date" placeholder="時間地點 (例: 週六晚上 8 點)">
            <button onclick="submitEvent()">發布聚會</button><button class="secondary" onclick="cancelCreate()">取消</button>
        </div>
        <div id="create-poll-section" class="hidden">
            <h2>建立新投票</h2>
            <input type="text" id="poll-question" placeholder="投票問題 (例: 聚會想吃什麼？)">
            <textarea id="poll-options" placeholder="輸入選項 (請換行分隔)&#10;例如：&#10;披薩&#10;熱炒&#10;烤肉" style="height: 100px;"></textarea>
            <div style="display:flex; gap:10px;">
                <div style="flex:1;"><label style="font-size:13px; font-weight:bold;">選項設定：</label><select id="poll-multiple"><option value="single">單選</option><option value="multiple">多選</option></select></div>
                <div style="flex:1;"><label style="font-size:13px; font-weight:bold;">匿名設定：</label><select id="poll-mode"><option value="realname">📝 實名</option><option value="anonymous">🕵️‍♂️ 匿名</option></select></div>
            </div>
            <button onclick="submitPoll()" style="margin-top: 20px;">發布投票</button><button class="secondary" onclick="cancelCreate()">取消</button>
        </div>
    </div>
</div>

<script>
    // --- 雲端大腦 (Firebase) 連線設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyBWQ6GAMAsPESR3vPe7tqkGPg3KzUtSdJQ",
      authDomain: "taitung-boss.firebaseapp.com",
      projectId: "taitung-boss",
      storageBucket: "taitung-boss.firebasestorage.app",
      messagingSenderId: "466331597059",
      appId: "1:466331597059:web:9d48ad26475fc71e721136",
      measurementId: "G-69WW2E5L8L"
    };
    
    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 系統變數 ---
    let allUsers = {};
    let adminPhones = [];
    let eventsData = [];
    let pollsData = [];
    let postsData = [];
    let systemInviteCode = '8888';
    let announcementText = '歡迎來到台東老闆專屬聚會！\n這是一個私密的交流空間，大家可以在這裡發起聚餐、投票決定餐廳，或是分享開店日常。\n\n如果有臨時特休，記得去「會員卡」更新店休設定喔！';
    
    let currentUserPhone = null;
    let currentTab = 'home'; 
    let isDataLoaded = false;

    // --- 雲端資料同步監聽 (魔法就在這裡！) ---
    db.collection("taitung_app").onSnapshot((snapshot) => {
        snapshot.docs.forEach((doc) => {
            const dataStr = doc.data().d;
            if (dataStr) {
                const parsed = JSON.parse(dataStr);
                if (doc.id === "users") allUsers = parsed || {};
                if (doc.id === "admins") adminPhones = parsed || [];
                if (doc.id === "events") eventsData = parsed || [];
                if (doc.id === "polls") pollsData = parsed || [];
                if (doc.id === "posts") postsData = parsed || [];
                if (doc.id === "settings") {
                    systemInviteCode = parsed.inviteCode || '8888';
                    announcementText = parsed.announcement || announcementText;
                }
            }
        });

        // 第一次載入完成後，關閉等待畫面，顯示主程式
        if (!isDataLoaded) {
            isDataLoaded = true;
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-app-wrapper').classList.remove('hidden');
            initApp(); 
        } else {
            // 別人發文時，畫面即時刷新
            if (currentUserPhone) {
                switchTab(currentTab);
                if(currentTab === 'home' || currentTab === 'card') renderAnnouncement();
            }
        }
    });

    // --- 寫入雲端的工具函數 ---
    function saveAllData() {
        db.collection("taitung_app").doc("users").set({ d: JSON.stringify(allUsers) });
        db.collection("taitung_app").doc("admins").set({ d: JSON.stringify(adminPhones) });
        db.collection("taitung_app").doc("events").set({ d: JSON.stringify(eventsData) });
        db.collection("taitung_app").doc("polls").set({ d: JSON.stringify(pollsData) });
        db.collection("taitung_app").doc("posts").set({ d: JSON.stringify(postsData) });
    }

    function saveSettings() {
        db.collection("taitung_app").doc("settings").set({ d: JSON.stringify({ inviteCode: systemInviteCode, announcement: announcementText }) });
    }

    // --- 初始化系統 ---
    function initApp() {
        const savedPhone = localStorage.getItem('taitung_current_phone');
        if (savedPhone && allUsers[savedPhone]) {
            currentUserPhone = savedPhone;
            showMain();
        } else {
            showSection('login-section');
            document.getElementById('phone-input').addEventListener('input', function(e) {
                const phoneVal = e.target.value.trim();
                if(phoneVal.length === 10 && allUsers[phoneVal]) {
                    document.getElementById('invite-code-container').style.display = 'none';
                } else {
                    document.getElementById('invite-code-container').style.display = 'block';
                }
            });
        }
    }

    function getInitial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
    function getUserStats(phone) {
        const user = allUsers[phone];
        if(!user) return { tier: '🌱 新人', months: 0, attended: 0 };
        const monthsJoined = Math.floor((Date.now() - user.joinDate) / (1000 * 60 * 60 * 24 * 30));
        let attendedCount = 0;
        eventsData.forEach(e => { if(e.attendees && e.attendees[phone] === 'attend') attendedCount++; });
        let tier = '🌱 新人';
        if (user.manualTier) tier = user.manualTier; else if (monthsJoined >= 2 && attendedCount >= 2) tier = '👑 元老'; else if (monthsJoined >= 1) tier = '⭐ 成員';
        return { tier, months: monthsJoined, attended: attendedCount, joinDateStr: new Date(user.joinDate).toLocaleDateString('zh-TW') };
    }

    function showSection(id) {
        ['login-section', 'profile-section', 'main-section', 'create-event-section', 'create-poll-section'].forEach(sec => document.getElementById(sec).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if (id === 'main-section') {
            document.getElementById('nav-section').classList.remove('hidden');
            const user = allUsers[currentUserPhone];
            document.getElementById('welcome-msg').innerText = `${user.name} ${user.customEmoji || '✨'}`;

            document.getElementById('my-avatar').style.backgroundColor = user.customColor || '#005f20';
        } else { document.getElementById('nav-section').classList.add('hidden'); }
    }

    function showMain() { showSection('main-section'); switchTab(currentTab); }

    function switchTab(tab) {
        currentTab = tab;
        ['home', 'events', 'polls', 'closures', 'card'].forEach(t => { document.getElementById(`tab-${t}`).classList.remove('active'); document.getElementById(`${t}-view`).classList.add('hidden'); });
        document.getElementById(`tab-${tab}`).classList.add('active'); document.getElementById(`${tab}-view`).classList.remove('hidden');
        if(tab === 'home') renderHome(); else if(tab === 'events') renderEvents('events-list', eventsData); else if(tab === 'polls') renderPolls('polls-list', pollsData); else if(tab === 'closures') renderClosures(); else if(tab === 'card') renderCardView();
    }

    function login() {
        const phone = document.getElementById('phone-input').value.trim(); const inviteCode = document.getElementById('invite-code-input').value.trim();
        if (!/^\d{10}$/.test(phone)) { alert("請輸入正確的 10 位數手機號碼！"); return; }
        if (allUsers[phone]) { localStorage.setItem('taitung_current_phone', phone); currentUserPhone = phone; showMain(); } 
        else {
            if (inviteCode !== systemInviteCode) { alert("邀請碼錯誤！這是一個私密社群，請向管理員索取最新的邀請碼。"); return; }
            localStorage.setItem('taitung_current_phone', phone); showSection('profile-section');
        }
    }

    function saveProfile() {
        const name = document.getElementById('name-input').value.trim(); const phone = localStorage.getItem('taitung_current_phone');
        if (!name) { alert("請輸入稱呼！"); return; }
        if (adminPhones.length === 0) { adminPhones.push(phone); }
        allUsers[phone] = { phone: phone, name: name, joinDate: Date.now(), customColor: '#005f20', customEmoji: '✨', manualTier: null, closedDays: [], tempClosedDates: [] };
        currentUserPhone = phone; 
        saveAllData(); // 寫入雲端
        showMain();
    }
    
    function logout() { localStorage.removeItem('taitung_current_phone'); currentUserPhone = null; document.getElementById('phone-input').value = ''; document.getElementById('invite-code-input').value = ''; showSection('login-section'); }

    // --- 發文系統 ---
    function compressImage(file, callback) {
        if (!file) { callback(null); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image(); img.onload = function() {
                const canvas = document.createElement('canvas'); const MAX_WIDTH = 600; let width = img.width; let height = img.height;
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height); callback(canvas.toDataURL('image/jpeg', 0.7));
            }; img.src = e.target.result;
        }; reader.readAsDataURL(file);
    }

    function submitPost() {
        const text = document.getElementById('post-text-input').value.trim(); const fileInput = document.getElementById('post-image-input');
        if (!text && !fileInput.files[0]) { alert("請至少寫點文字或上傳一張照片喔！"); return; }
        const createPostData = (imgBase64) => {
            postsData.unshift({ id: Date.now(), type: 'post', text: text, image: imgBase64, creatorPhone: currentUserPhone, date: new Date().toLocaleDateString('zh-TW'), comments: [] });
            saveAllData(); document.getElementById('post-text-input').value = ''; fileInput.value = ''; renderHome();
        };
        if (fileInput.files[0]) compressImage(fileInput.files[0], createPostData); else createPostData(null);
    }
    function submitEvent() {
        const title = document.getElementById('event-title').value; const date = document.getElementById('event-date').value;
        if (!title || !date) { alert("請填寫聚會名稱與時間！"); return; }
        eventsData.unshift({ id: Date.now(), type: 'event', title: title, date: date, creatorPhone: currentUserPhone, attendees: {}, comments: [], latestActivity: '', isClosed: false });
        saveAllData(); document.getElementById('event-title').value = ''; document.getElementById('event-date').value = ''; currentTab = 'events'; showMain();
    }
    function submitPoll() {
        const question = document.getElementById('poll-question').value; const optionsRaw = document.getElementById('poll-options').value; const mode = document.getElementById('poll-mode').value; const isMultiple = document.getElementById('poll-multiple').value === 'multiple';
        if (!question || !optionsRaw) { alert("請填寫問題與選項！"); return; }
        const options = optionsRaw.split('\n').map(opt => opt.trim()).filter(opt => opt !== "");
        if(options.length < 2) { alert("至少需輸入兩個選項，請記得換行喔！"); return; }
        pollsData.unshift({ id: Date.now(), type: 'poll', question: question, options: options, mode: mode, isMultiple: isMultiple, creatorPhone: currentUserPhone, votes: [], latestActivity: '', isClosed: false });
        saveAllData(); document.getElementById('poll-question').value = ''; document.getElementById('poll-options').value = ''; currentTab = 'polls'; showMain();
    }

    function toggleCard(id) {
        const detailDiv = document.getElementById(`details-${id}`);
        const iconSpan = document.getElementById(`icon-${id}`);
        if(detailDiv.classList.contains('hidden')) {
            detailDiv.classList.remove('hidden');

        } else {
            detailDiv.classList.add('hidden');
            iconSpan.innerText = '🔽 展開';

    function closeItem(type, id) {
        if(!confirm("確定要截止嗎？截止後大家就不能再報名或投票囉！")) return;
        if(type === 'event') { const item = eventsData.find(e => e.id === id); if(item) item.isClosed = true; saveAllData(); } 
        else if (type === 'poll') { const item = pollsData.find(p => p.id === id); if(item) item.isClosed = true; saveAllData(); }
        switchTab(currentTab);
    }
    function deleteItem(type, id) {
        if(!confirm("確定要刪除這篇文章/活動嗎？")) return;
        if(type === 'event') { eventsData = eventsData.filter(e => e.id !== id); } 
        else if(type === 'poll') { pollsData = pollsData.filter(p => p.id !== id); }
        else if(type === 'post') { postsData = postsData.filter(p => p.id !== id); }
        saveAllData(); switchTab(currentTab);
    }
    function deleteComment(type, itemId, commentIndex) {
        if(!confirm("確定要刪除這則留言嗎？")) return;
        let dataArray;
        if(type === 'event') { dataArray = eventsData; } else if(type === 'post') { dataArray = postsData; }
        const item = dataArray.find(i => i.id === itemId);
        if(item) { item.comments.splice(commentIndex, 1); saveAllData(); switchTab(currentTab); }
    }
    function addComment(type, id) {
        const input = document.getElementById(`comment-input-${id}`); const text = input.value.trim(); if (!text) return;
        const newComment = { phone: currentUserPhone, text: text, time: new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'}) };
        if (type === 'post') { const post = postsData.find(p => p.id === id); post.comments.push(newComment); } 
        else if (type === 'event') { const evt = eventsData.find(e => e.id === id); evt.comments.push(newComment); evt.latestActivity = `${allUsers[currentUserPhone].name} 剛剛留言了！`; }
        saveAllData(); input.value = ''; switchTab(currentTab);
        document.getElementById(`details-${type}-${id}`).classList.remove('hidden'); 
    }
    function submitVote(pollId) {
        const poll = pollsData.find(p => p.id === pollId); if(poll.isClosed) { alert("此投票已截止！"); return; }
        const selectedOptions = document.querySelectorAll(`input[name="poll-${pollId}"]:checked`);
        if (selectedOptions.length === 0) { alert("請至少選擇一個選項！"); return; }
        poll.votes = poll.votes.filter(v => v.phone !== currentUserPhone); 
        selectedOptions.forEach(opt => { poll.votes.push({ phone: currentUserPhone, option: opt.value }); });
        poll.latestActivity = poll.mode === 'anonymous' ? `剛剛有人投了票！` : `${allUsers[currentUserPhone].name} 參與了投票！`;
        saveAllData(); switchTab(currentTab);
        document.getElementById(`details-poll-${pollId}`).classList.remove('hidden'); 
    }
    function toggleAttendance(eventId, status) {
        const evt = eventsData.find(e => e.id === eventId); if(evt.isClosed) { alert("此活動已截止報名！"); return; }
        const me = allUsers[currentUserPhone];
        if (evt) {
            if (evt.attendees[currentUserPhone] === status) { delete evt.attendees[currentUserPhone]; evt.latestActivity = `${me.name} 取消了報名。`; } 
            else { evt.attendees[currentUserPhone] = status; evt.latestActivity = status === 'attend' ? `${me.name} 決定參加了！` : `${me.name} 殘念不能來。`; }
            saveAllData(); switchTab(currentTab);
            document.getElementById(`details-event-${eventId}`).classList.remove('hidden'); 
        }
    }

            const badgeHtml = isClosed ? `<div class="badge badge-closed">已截止</div>` : `<div class="badge">聚會</div>`;

    function renderPolls(containerId, dataArray) {
        const list = typeof containerId === 'string' ? document.getElementById(containerId) : containerId; if(typeof containerId === 'string') list.innerHTML = '';
        dataArray.forEach(poll => {
            const myVotes = poll.votes.filter(v => v.phone === currentUserPhone).map(v => v.option); 
            const uniqueVotersCount = new Set(poll.votes.map(v => v.phone)).size;
            const creator = allUsers[poll.creatorPhone] || {name: '已刪除的使用者', customColor: '#005f20'};
            const isClosed = poll.isClosed; const inputType = poll.isMultiple ? 'checkbox' : 'radio';
            
            const optionsHtml = poll.options.map((opt, idx) => { 
                const isChecked = myVotes.includes(opt) ? 'checked' : ''; const disabled = isClosed ? 'disabled' : '';
                return `<div class="vote-option"><input type="${inputType}" name="poll-${poll.id}" value="${opt}" id="opt-${poll.id}-${idx}" ${isChecked} ${disabled}><label for="opt-${poll.id}-${idx}">${opt}</label></div>`; 
            }).join('');
            
            let resultsHtml = '';
            if (uniqueVotersCount > 0) {
                resultsHtml = `<div class="vote-results"><strong>📊 投票狀況 (共 ${uniqueVotersCount} 人參與)：</strong><br>`;
                poll.options.forEach(opt => {
                    const votesForOpt = poll.votes.filter(v => v.option === opt); const count = votesForOpt.length; const percent = uniqueVotersCount > 0 ? Math.round((count / uniqueVotersCount) * 100) : 0;
                    resultsHtml += `<div style="margin-top:10px; display:flex; justify-content:space-between; font-size:13px;"><span>${opt}</span><span>${count}票 (${percent}%)</span></div><div class="vote-bar-bg"><div class="vote-fill" style="width: ${percent}%;"></div></div>`;
                    if (poll.mode === 'realname' && count > 0) { const votersStr = votesForOpt.map(v => allUsers[v.phone] ? `${allUsers[v.phone].name}` : '未知').join('、'); resultsHtml += `<div style="font-size:12px; color:#888; margin-top:4px;">🙋‍♂️ ${votersStr}</div>`; }
                });
                resultsHtml += '</div>';
            }

            const canManage = poll.creatorPhone === currentUserPhone || adminPhones.includes(currentUserPhone);
            let actionHtml = '';
            if (canManage) {
                const closeBtnHtml = !isClosed ? `<button class="action-btn close" onclick="closeItem('poll', ${poll.id})">🛑 截止</button>` : '';
                actionHtml = `<div class="card-actions">${closeBtnHtml}<button class="action-btn delete" onclick="deleteItem('poll', ${poll.id})">🗑️ 刪除</button></div>`;
            }

            let adminListHtml = '';
            if (adminPhones.includes(currentUserPhone) && uniqueVotersCount > 0) {
                const uniqueVoters = [...new Set(poll.votes.map(v => v.phone))].map(p => allUsers[p] ? allUsers[p].name : '未知').join('、 ');
                const hintText = poll.mode === 'anonymous' ? ' (匿名保護：僅顯示有參與投票的人員)' : '';
                adminListHtml = `
                    <div style="background-color: #fff3e0; border: 1px dashed #ff9800; padding: 10px; border-radius: 5px; margin-top: 15px; font-size: 13px; color: #d35400; line-height: 1.6;">
                        <strong>👑 管理員名單總覽</strong><br>
                        <strong>🗳️ 已參與人員${hintText}：</strong><br>${uniqueVoters}
                    </div>
                `;
            }

            let badgeType = poll.mode === 'anonymous' ? '🕵️‍♂️ 匿名' : '📝 實名'; badgeType += poll.isMultiple ? ' / 多選' : ' / 單選';
            const badgeHtml = isClosed ? `<div class="badge badge-closed">已截止</div>` : `<div class="badge badge-poll">投票 · ${badgeType}</div>`;
            const activityHtml = poll.latestActivity ? `<div class="latest-activity">✨ 最新動態：${poll.latestActivity}</div>` : '';
            const voteBtnHtml = isClosed ? `<div style="text-align:center; width:100%; color:#d32f2f; font-weight:bold; padding:10px; background:#ffebee; border-radius:5px;">🛑 本投票已截止</div>` : `<button style="width: 100%; padding: 8px;" onclick="submitVote(${poll.id})">送出選票</button>`;

            const cardHtml = `
                <div class="card">
                    <div class="card-summary" onclick="toggleCard('poll-${poll.id}')">
                        <div class="card-summary-left">
                            <div class="text-avatar" style="background-color:${creator.customColor||'#005f20'}">${getInitial(creator.name)}</div>
                            <div style="flex:1; min-width:0;">
                                ${badgeHtml}
                                <div class="card-title">${poll.question}</div>
                                <div class="card-creator">${creator.name}</div>
                            </div>
                        </div>
                        <div class="card-summary-right" id="icon-poll-${poll.id}">🔽 展開</div>
                    </div>

                    <div id="details-poll-${poll.id}" class="card-details hidden">
                        ${actionHtml}
                        <div>${optionsHtml}<div class="vote-controls">${voteBtnHtml}</div>${resultsHtml}${adminListHtml}${activityHtml}</div>
                    </div>
                </div>`;
            if(typeof containerId === 'string') list.innerHTML += cardHtml; else list.innerHTML = cardHtml;
        });
    }

    // --- 店休總覽 ---
    function renderClosures() {
        const days = ['一', '二', '三', '四', '五', '六', '日']; let regularHtml = '';
        days.forEach(day => {
            const closedUsers = Object.values(allUsers).filter(u => u.closedDays && u.closedDays.includes(day));
            if(closedUsers.length > 0) {
                const names = closedUsers.map(u => `${u.name} ${u.customEmoji||''}`).join('、');
                regularHtml += `<div class="closure-day-row"><div class="closure-day-label">星期${day}</div><div class="closure-day-list">${names}</div></div>`;
            }
        });
        if(!regularHtml) regularHtml = '<p style="text-align:center; color:#888; font-size:14px;">目前還沒有人設定固定店休喔！</p>';
        document.getElementById('regular-closures-list').innerHTML = regularHtml;

        let tempDatesMap = {};
        Object.values(allUsers).forEach(u => { if(u.tempClosedDates) { u.tempClosedDates.forEach(date => { if(!tempDatesMap[date]) tempDatesMap[date] = []; tempDatesMap[date].push(`${u.name} ${u.customEmoji||''}`); }); } });
        const sortedDates = Object.keys(tempDatesMap).sort(); let tempHtml = '';
        sortedDates.forEach(date => {
            const dateObj = new Date(date); const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()} (${['日','一','二','三','四','五','六'][dateObj.getDay()]})`;
            tempHtml += `<div class="closure-day-row"><div class="closure-day-label" style="width:90px; color:#d35400;">${dateStr}</div><div class="closure-day-list" style="color:#d35400;">${tempDatesMap[date].join('、')}</div></div>`;
        });
        if(!tempHtml) tempHtml = '<p style="text-align:center; color:#888; font-size:14px;">近期大家都在認真賺錢，沒有臨時特休！</p>';
        document.getElementById('temp-closures-list').innerHTML = tempHtml;
    }

    // --- 後台管理員渲染區 ---
    function renderCardView() {
        const me = allUsers[currentUserPhone]; if(!me) return; const stats = getUserStats(currentUserPhone);
        const cardColor = me.customColor || '#005f20'; const cardEmoji = me.customEmoji || '✨';
        document.getElementById('card-color-picker').value = cardColor; document.getElementById('card-emoji-input').value = cardEmoji;

        const checkboxes = document.querySelectorAll('#closed-days-checkboxes input'); checkboxes.forEach(cb => { cb.checked = me.closedDays && me.closedDays.includes(cb.value); });
        let tempListHtml = '';
        if(me.tempClosedDates && me.tempClosedDates.length > 0) { me.tempClosedDates.forEach(d => { tempListHtml += `<div style="display:inline-block; background:#eee; padding:3px 8px; border-radius:15px; margin:2px 5px 2px 0;">${d} <span style="cursor:pointer; color:#d32f2f; margin-left:3px;" onclick="removeTempCloseDate('${d}')">✕</span></div>`; }); } else { tempListHtml = '無臨時特休'; }
        document.getElementById('temp-close-list').innerHTML = tempListHtml;
        const closedDaysStr = (me.closedDays && me.closedDays.length > 0) ? `星期${me.closedDays.join('、')}` : '無';

        document.getElementById('my-membership-card').innerHTML = `
            <div class="membership-card" style="background: linear-gradient(135deg, ${cardColor} 0%, #111111 150%);">
                <div class="member-tier-display">${stats.tier}</div><div style="font-size: 28px; font-weight: bold; margin-bottom: 20px;">${me.name} <span style="font-size:24px;">${cardEmoji}</span></div>
                <div class="member-info-row"><span>電話帳號</span><span>${me.phone}</span></div>
                <div class="member-info-row"><span>聚會參與</span><span>已參加 ${stats.attended} 次</span></div>
                <div class="member-info-row"><span>系統資歷</span><span>滿 ${stats.months} 個月</span></div>
                <div class="member-info-row" style="color:#ffd700; margin-top:15px; border:none; padding-bottom:0;"><span>📍 固定店休</span><span>${closedDaysStr}</span></div>
            </div>`;

        const adminContainer = document.getElementById('admin-panel-container');
        if (adminPhones.includes(currentUserPhone)) {
            let usersListHtml = '';
            for (let p in allUsers) {
                const u = allUsers[p]; const uStats = getUserStats(p); const isMe = p === currentUserPhone ? '(您自己)' : '';
                const adminBadge = adminPhones.includes(p) ? '<span style="color:#d32f2f; font-weight:bold; font-size:12px; margin-left:5px;">[管理員]</span>' : '';
                let actionsHtml = '';
                if(p !== currentUserPhone) {
                    const promoteBtn = (!u.manualTier && uStats.tier !== '👑 元老') ? `<button class="promote-btn" onclick="promoteUser('${p}')">🌟 升元老</button>` : '';
                    const adminToggleBtn = adminPhones.includes(p) ? `<button class="secondary" style="font-size:12px; padding:5px 10px; margin:0;" onclick="toggleAdmin('${p}')">撤銷管理</button>` : `<button class="admin-btn" onclick="toggleAdmin('${p}')">設為管理</button>`;
                    actionsHtml = `<div class="admin-actions">${adminToggleBtn}${promoteBtn}<button class="kick-btn" onclick="kickUser('${p}')">踢除</button></div>`;
                }
                usersListHtml += `<div class="admin-user-row"><div><strong>${u.name} ${u.customEmoji || ''}</strong> ${isMe} ${adminBadge}<br><span style="font-size:12px; color:#666;">${p} | ${uStats.tier}</span></div>${actionsHtml}</div>`;
            }
            adminContainer.innerHTML = `
                <div class="admin-panel"><div class="admin-title">🔑 邀請碼管理</div><div style="display: flex; gap: 10px; margin-bottom: 10px;"><input type="text" id="admin-invite-code" value="${systemInviteCode}" style="margin:0;"><button onclick="changeInviteCode()" style="margin:0; width:auto; white-space:nowrap;">更新密碼</button></div><p style="font-size:12px; color:#666;">更改邀請碼可防堵非相關人士註冊。</p></div>
                <div class="admin-panel"><div class="admin-title">🛡️ 團隊與權限管理</div><p style="font-size:13px; color:#666; margin-top:0;">您可提拔元老，或設定其他成員為管理員共同管理版面。</p>${usersListHtml}</div>`;
        } else { adminContainer.innerHTML = ''; }
    }
    
    function changeInviteCode() { const newCode = document.getElementById('admin-invite-code').value.trim(); if(!newCode) { alert("不能為空！"); return; } systemInviteCode = newCode; saveSettings(); alert(`更新成功：${newCode}`); }
    function promoteUser(targetPhone) { if(confirm(`確定晉升為「👑 元老」？`)) { allUsers[targetPhone].manualTier = '👑 元老'; saveAllData(); renderCardView(); alert("提拔成功！"); } }
    function toggleAdmin(targetPhone) {
        if(adminPhones.includes(targetPhone)) { if(confirm("確定要撤銷此人的管理員權限嗎？")) { adminPhones = adminPhones.filter(phone => phone !== targetPhone); saveAllData(); renderCardView(); } } 
        else { if(confirm("確定要將此人設為管理員嗎？他將可以幫忙刪除文章與管理成員。")) { adminPhones.push(targetPhone); saveAllData(); renderCardView(); alert("已成功授權管理員！"); } }
    }
    function kickUser(targetPhone) { 
        if(confirm(`確定踢除此人？`)) { 
            delete allUsers[targetPhone]; adminPhones = adminPhones.filter(phone => phone !== targetPhone);
            eventsData.forEach(e => { if(e.attendees && e.attendees[targetPhone]) delete e.attendees[targetPhone]; }); 
            saveAllData(); renderCardView(); 
        } 
    }
</script>
</body>

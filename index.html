<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東老闆專屬聚會</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif; background-color: #f4f4f4; color: #005f20; margin: 0; padding: 0; display: flex; justify-content: center; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #005f20; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; z-index: 9999; }
        .spinner { margin-top: 15px; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; border-left: 3px solid #005f20; border-right: 3px solid #005f20; box-sizing: border-box; position: relative; }
        .header { background-color: #005f20; color: #ffffff; text-align: center; padding: 15px; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        .nav-tabs { display: flex; background-color: #e0f0e5; border-bottom: 2px solid #005f20; overflow-x: auto; white-space: nowrap; }
        .nav-tab { flex: 1; text-align: center; padding: 12px 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: #004415; }
        .nav-tab.active { background-color: #005f20; color: #ffffff; }
        .content { padding: 20px; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #005f20; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #005f20; color: #ffffff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #004415; }
        button.secondary { background-color: #ffffff; color: #005f20; }
        .announcement-board { background-color: #fffaf0; border: 2px dashed #d35400; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .announcement-title { color: #d35400; font-weight: bold; margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center;}
        .announcement-text { font-size: 14px; color: #333; line-height: 1.5; white-space: pre-wrap;}
        .card { border: 2px dashed #005f20; border-radius: 8px; margin-bottom: 15px; background-color: #fafafa; }
        .card-summary { display: flex; align-items: center; justify-content: space-between; padding: 15px; cursor: pointer; }
        .card-summary-left { display: flex; align-items: center; flex: 1; min-width: 0; }
        .card-summary-right { font-size: 13px; color: #005f20; font-weight: bold; flex-shrink: 0; margin-left: 10px; }
        .card-details { padding: 0 15px 15px 15px; border-top: 1px dashed #ddd; margin-top: -5px; padding-top: 15px; position: relative;}
        .text-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #005f20; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
        .card-title { font-size: 16px; font-weight: bold; color: #005f20; padding-right: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
        .badge { background-color: #005f20; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; display: inline-block; }
        .badge-pinned { background-color: #d32f2f; } /* 置頂標籤顏色 */
        .card-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
        .action-btn { background: none; border: none; padding: 5px; font-size: 14px; cursor: pointer; border-radius: 5px; width: auto; font-weight: normal; }
        .attendance-group { display: flex; gap: 10px; margin-bottom: 15px; margin-top: 10px;}
        .attendance-btn { flex: 1; padding: 10px; font-size: 14px; }
        .comment-section { border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 10px;}
        .comment-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .comment-item { background-color: #fff; padding: 8px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #eee; font-size: 14px; position: relative; padding-right: 30px;}
        
        /* 店休樣式修正 */
        .closure-day-row { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; align-items: center; }
        .closure-day-label { width: 80px; font-weight: bold; color: #005f20; flex-shrink: 0; font-size: 15px; }
        .closure-day-list { color: #555; font-size: 14px; line-height: 1.6; flex: 1; text-align: left;}
        
        .membership-card { color: white; border-radius: 12px; padding: 25px 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); margin-bottom: 20px; position: relative; overflow: hidden; }
        .member-info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 4px; }
        .custom-style-panel { background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .ratio-bar { width: 100%; height: 10px; border-radius: 5px; background-color: #ddd; display: flex; overflow: hidden; margin-bottom: 5px; }
        .ratio-attend { background-color: #005f20; height: 100%; }
        .ratio-absent { background-color: #d32f2f; height: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading-screen"><div>正在同步雲端資料...</div><div class="spinner"></div></div>

<div class="app-container hidden" id="main-app-wrapper">
    <div class="header">台東老闆專屬聚會</div>
    <div id="nav-section" class="nav-tabs hidden">
        <div class="nav-tab active" id="tab-home" onclick="switchTab('home')">首頁動態</div>
        <div class="nav-tab" id="tab-events" onclick="switchTab('events')">聚會報名</div>
        <div class="nav-tab" id="tab-polls" onclick="switchTab('polls')">投票區</div>
        <div class="nav-tab" id="tab-closures" onclick="switchTab('closures')">店休總覽</div>
        <div class="nav-tab" id="tab-card" onclick="switchTab('card')">會員卡</div>
    </div>

    <div class="content">
        <div id="login-section" class="hidden">
            <h2>台東老闆專屬聚會</h2>
            <input type="tel" id="phone-input" placeholder="手機號碼 (10碼)" maxlength="10">
            <div id="invite-code-container"><input type="text" id="invite-code-input" placeholder="專屬邀請碼"></div>
            <button onclick="login()">進入系統</button>
        </div>

        <div id="profile-section" class="hidden">
            <h2>設定基本資料</h2>
            <input type="text" id="name-input" placeholder="您的稱呼或店名">
            <button onclick="saveProfile()">儲存並進入</button>
        </div>

        <div id="main-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display: flex; align-items: center;"><div id="my-avatar" class="text-avatar" style="width:30px; height:30px; font-size:14px;"></div><span id="welcome-msg" style="font-weight:bold;">歡迎！</span></div>
                <button style="width: auto; padding: 5px 15px; font-size: 14px;" class="secondary" onclick="logout()">登出</button>
            </div>
            
            <div id="home-view">
                <div id="announcement-board" class="announcement-board">
                    <div class="announcement-title"><span>📌 老闆公告牆</span><span id="edit-notice-container"></span></div>
                    <div class="announcement-text" id="announcement-text-display">載入中...</div>
                </div>
                <div class="post-input-area">
                    <textarea id="post-text-input" placeholder="分享開店日常..." style="height: 60px;"></textarea>
                    <input type="file" id="post-image-input" accept="image/*">
                    <button onclick="submitPost()">發佈動態</button>
                </div>
                <div id="home-list"></div>
            </div>

            <div id="events-view" class="hidden"><button onclick="showCreateForm('event')">＋ 發起新聚會</button><div id="events-list" style="margin-top:20px;"></div></div>
            <div id="polls-view" class="hidden"><button onclick="showCreateForm('poll')">＋ 建立新投票</button><div id="polls-list" style="margin-top:20px;"></div></div>
            
            <div id="closures-view" class="hidden">
                <h3 style="color: #005f20;">📍 固定店休</h3>
                <div class="card" id="regular-closures-list" style="padding:10px;"></div>
                <h3 style="color: #d35400; margin-top: 30px;">🏖️ 臨時特休</h3>
                <div class="card" id="temp-closures-list" style="padding:10px;"></div>
            </div>

            <div id="card-view" class="hidden">
                <div id="my-membership-card"></div>
                <div class="custom-style-panel">
                    <h4 style="margin:0 0 10px 0;">👤 修改個人稱呼</h4>
                    <input type="text" id="new-name-input" placeholder="新稱呼">
                    <p id="name-change-hint" style="font-size:12px; color:#666; margin-top:-5px;"></p>
                    <button id="change-name-btn" onclick="updateUserName()">更新名稱 (一個月限改一次)</button>
                </div>
                <div class="custom-style-panel">
                    <h4 style="margin:0 0 10px 0;">📅 我的店休設定</h4>
                    <div style="margin-bottom:10px; font-size:14px;" id="closed-days-checkboxes">
                        <label><input type="checkbox" value="一">一</label><label><input type="checkbox" value="二">二</label><label><input type="checkbox" value="三">三</label><label><input type="checkbox" value="四">四</label><label><input type="checkbox" value="五">五</label><label><input type="checkbox" value="六">六</label><label><input type="checkbox" value="日">日</label>
                    </div>
                    <div style="display:flex; gap:10px;"><input type="date" id="temp-close-date" style="margin:0;"><button onclick="addTempCloseDate()" style="margin:0; width:auto;">新增特休</button></div>
                    <div id="temp-close-list" style="margin-top:10px; font-size:13px; color:#555;"></div>
                    <button onclick="saveClosureSettings()" style="margin-top:15px; background-color:#d35400;">儲存店休</button>
                </div>
                <div class="custom-style-panel">
                    <h4 style="margin:0 0 10px 0;">🎨 卡片風格</h4>
                    <input type="color" id="card-color-picker" value="#005f20">
                    <input type="text" id="card-emoji-input" placeholder="Emoji (例: 🦖)" maxlength="2">
                    <button onclick="saveCardStyle()">儲存風格</button>
                </div>
                <div id="admin-panel-container"></div>
            </div>
        </div>

        <div id="create-event-section" class="hidden"><h2>發起新聚會</h2><input type="text" id="event-title" placeholder="名稱"><input type="text" id="event-date" placeholder="時間地點"><button onclick="submitEvent()">發布</button><button class="secondary" onclick="cancelCreate()">取消</button></div>
        <div id="create-poll-section" class="hidden"><h2>建立新投票</h2><input type="text" id="poll-question" placeholder="問題"><textarea id="poll-options" placeholder="選項 (換行分隔)"></textarea><button onclick="submitPoll()">發布</button><button class="secondary" onclick="cancelCreate()">取消</button></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWQ6GAMAsPESR3vPe7tqkGPg3KzUtSdJQ",
      authDomain: "taitung-boss.firebaseapp.com",
      projectId: "taitung-boss",
      storageBucket: "taitung-boss.firebasestorage.app",
      messagingSenderId: "466331597059",
      appId: "1:466331597059:web:9d48ad26475fc71e721136"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allUsers = {}, adminPhones = [], eventsData = [], pollsData = [], postsData = [], systemInviteCode = '8888', announcementText = '';
    let currentUserPhone = null, currentTab = 'home', isDataLoaded = false;

    db.collection("taitung_app").onSnapshot((snapshot) => {
        snapshot.docs.forEach((doc) => {
            const data = JSON.parse(doc.data().d || '{}');
            if (doc.id === "users") allUsers = data;
            if (doc.id === "admins") adminPhones = data;
            if (doc.id === "events") eventsData = data;
            if (doc.id === "polls") pollsData = data;
            if (doc.id === "posts") postsData = data;
            if (doc.id === "settings") { systemInviteCode = data.inviteCode || '8888'; announcementText = data.announcement || '歡迎來到台東老闆專屬聚會！'; }
        });
        if (!isDataLoaded) { isDataLoaded = true; document.getElementById('loading-screen').style.display = 'none'; document.getElementById('main-app-wrapper').classList.remove('hidden'); initApp(); }
        else if (currentUserPhone) { switchTab(currentTab); renderAnnouncement(); }
    });

    function saveAllData() {
        db.collection("taitung_app").doc("users").set({ d: JSON.stringify(allUsers) });
        db.collection("taitung_app").doc("admins").set({ d: JSON.stringify(adminPhones) });
        db.collection("taitung_app").doc("events").set({ d: JSON.stringify(eventsData) });
        db.collection("taitung_app").doc("polls").set({ d: JSON.stringify(pollsData) });
        db.collection("taitung_app").doc("posts").set({ d: JSON.stringify(postsData) });
    }

    function initApp() {
        const savedPhone = localStorage.getItem('taitung_current_phone');
        if (savedPhone && allUsers[savedPhone]) { currentUserPhone = savedPhone; showMain(); } 
        else { showSection('login-section'); }
    }

    // --- 改名一個月一次邏輯 ---
    function updateUserName() {
        const newName = document.getElementById('new-name-input').value.trim();
        if (!newName) return;
        const me = allUsers[currentUserPhone];
        const now = Date.now();
        const thirtyDays = 30 * 24 * 60 * 60 * 1000;
        
        if (me.lastNameChange && (now - me.lastNameChange < thirtyDays)) {
            const remaining = Math.ceil((thirtyDays - (now - me.lastNameChange)) / (1000 * 60 * 60 * 24));
            alert(`距離下次修改名稱還需要 ${remaining} 天喔！`);
            return;
        }
        
        if (confirm(`確定要改名為「${newName}」嗎？改完後一個月內不能再改喔！`)) {
            me.name = newName;
            me.lastNameChange = now;
            saveAllData();
            alert("名稱更新成功！");
            document.getElementById('new-name-input').value = "";
            renderCardView();
        }
    }

    // --- 置頂功能 (Admin Only) ---
    function togglePin(type, id) {
        if (!adminPhones.includes(currentUserPhone)) return;
        let dataArray;
        if(type === 'post') dataArray = postsData;
        else if(type === 'event') dataArray = eventsData;
        else if(type === 'poll') dataArray = pollsData;
        
        const item = dataArray.find(i => i.id === id);
        if (item) {
            item.isPinned = !item.isPinned;
            saveAllData();
        }
    }

    // --- 排序邏輯 (置頂優先) ---
    function getSortedList(data) {
        return [...data].sort((a, b) => {
            if (a.isPinned && !b.isPinned) return -1;
            if (!a.isPinned && b.isPinned) return 1;
            return b.id - a.id;
        });
    }

    function renderHome() {
        renderAnnouncement();
        const list = document.getElementById('home-list'); list.innerHTML = '';
        let allItems = getSortedList([...postsData, ...eventsData, ...pollsData]);
        allItems.forEach(item => {
            const tempDiv = document.createElement('div');
            if(item.type === 'post') renderPosts(tempDiv, [item]); 
            else if(item.type === 'event') renderEvents(tempDiv, [item]); 
            else if(item.type === 'poll') renderPolls(tempDiv, [item]);
            list.appendChild(tempDiv.firstElementChild);
        });
    }

    // --- 原有功能的精簡化串接 ---
    function showSection(id) {
        ['login-section', 'profile-section', 'main-section', 'create-event-section', 'create-poll-section'].forEach(sec => document.getElementById(sec).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if (id === 'main-section') { document.getElementById('nav-section').classList.remove('hidden'); const u = allUsers[currentUserPhone]; document.getElementById('welcome-msg').innerText = `${u.name} ${u.customEmoji || '✨'}`; document.getElementById('my-avatar').innerText = u.name.charAt(0); document.getElementById('my-avatar').style.backgroundColor = u.customColor; }
    }
    function switchTab(tab) { currentTab = tab; ['home', 'events', 'polls', 'closures', 'card'].forEach(t => { document.getElementById(`tab-${t}`).classList.remove('active'); document.getElementById(`${t}-view`).classList.add('hidden'); }); document.getElementById(`tab-${tab}`).classList.add('active'); document.getElementById(`${tab}-view`).classList.remove('hidden'); if(tab === 'home') renderHome(); else if(tab === 'events') renderEvents('events-list', getSortedList(eventsData)); else if(tab === 'polls') renderPolls('polls-list', getSortedList(pollsData)); else if(tab === 'closures') renderClosures(); else if(tab === 'card') renderCardView(); }
    function login() { const p = document.getElementById('phone-input').value.trim(); const code = document.getElementById('invite-code-input').value.trim(); if (allUsers[p]) { localStorage.setItem('taitung_current_phone', p); currentUserPhone = p; showMain(); } else if (code === systemInviteCode) { localStorage.setItem('taitung_current_phone', p); showSection('profile-section'); } else { alert("邀請碼錯誤！"); } }
    function saveProfile() { const n = document.getElementById('name-input').value.trim(); const p = localStorage.getItem('taitung_current_phone'); if (!n) return; if (!adminPhones.length) adminPhones.push(p); allUsers[p] = { phone: p, name: n, joinDate: Date.now(), customColor: '#005f20', customEmoji: '✨', closedDays: [], tempClosedDates: [] }; currentUserPhone = p; saveAllData(); showMain(); }
    function logout() { localStorage.clear(); location.reload(); }
    function showMain() { showSection('main-section'); switchTab('home'); }
    function toggleCard(id) { const d = document.getElementById(`details-${id}`); const i = document.getElementById(`icon-${id}`); d.classList.toggle('hidden'); i.innerText = d.classList.contains('hidden') ? '🔽 展開' : '🔼 收起'; }
    function renderAnnouncement() { document.getElementById('announcement-text-display').innerText = announcementText; if (adminPhones.includes(currentUserPhone)) document.getElementById('edit-notice-container').innerHTML = `<button class="action-btn" style="color:#d35400;" onclick="editAnnouncement()">修改</button>`; }
    function editAnnouncement() { const t = prompt("新公告：", announcementText); if(t) { announcementText = t; db.collection("taitung_app").doc("settings").set({ d: JSON.stringify({ inviteCode: systemInviteCode, announcement: announcementText }) }); } }

    function renderPosts(target, data) {
        data.forEach(p => {
            const u = allUsers[p.creatorPhone] || {name: '未知', customColor: '#ccc'};
            const isAdmin = adminPhones.includes(currentUserPhone);
            const pinBtn = isAdmin ? `<button class="action-btn" onclick="togglePin('post', ${p.id})">${p.isPinned ? '📍 取消置頂' : '📌 置頂'}</button>` : '';
            const card = `<div class="card"><div class="card-summary" onclick="toggleCard('post-${p.id}')"><div class="card-summary-left"><div class="text-avatar" style="background-color:${u.customColor}">${u.name.charAt(0)}</div><div style="flex:1; min-width:0;">${p.isPinned ? '<div class="badge badge-pinned">置頂公告</div>' : ''}<div class="badge badge-post">分享</div><div class="card-title">${p.text.substring(0,15)}...</div><div class="card-creator">${u.name}</div></div></div><div class="card-summary-right" id="icon-post-${p.id}">🔽 展開</div></div><div id="details-post-${p.id}" class="card-details hidden"><div class="card-actions">${pinBtn}<button class="action-btn" style="color:red;" onclick="deleteItem('post', ${p.id})">🗑️</button></div><div class="post-text">${p.text}</div>${p.image ? `<img src="${p.image}" class="post-image">` : ''}</div></div>`;
            target.innerHTML += card;
        });
    }

    function renderEvents(target, data) {
        const list = typeof target === 'string' ? document.getElementById(target) : target; list.innerHTML = '';
        data.forEach(e => {
            const u = allUsers[e.creatorPhone] || {name: '未知', customColor: '#005f20'};
            const isAdmin = adminPhones.includes(currentUserPhone);
            const pinBtn = isAdmin ? `<button class="action-btn" onclick="togglePin('event', ${e.id})">${e.isPinned ? '📍 取消置頂' : '📌 置頂'}</button>` : '';
            const card = `<div class="card"><div class="card-summary" onclick="toggleCard('event-${e.id}')"><div class="card-summary-left"><div class="text-avatar" style="background-color:${u.customColor}">${u.name.charAt(0)}</div><div style="flex:1; min-width:0;">${e.isPinned ? '<div class="badge badge-pinned">置頂推薦</div>' : ''}<div class="badge">聚會</div><div class="card-title">${e.title}</div><div class="card-creator">${u.name}</div></div></div><div class="card-summary-right" id="icon-event-${e.id}">🔽 展開</div></div><div id="details-event-${e.id}" class="card-details hidden"><div class="card-actions">${pinBtn}<button class="action-btn" style="color:red;" onclick="deleteItem('event', ${e.id})">🗑️</button></div><p>地點：${e.date}</p><button onclick="toggleAttendance(${e.id}, 'attend')">✅ 報名</button></div></div>`;
            list.innerHTML += card;
        });
    }

    function renderPolls(target, data) {
        const list = typeof target === 'string' ? document.getElementById(target) : target; list.innerHTML = '';
        data.forEach(p => {
            const u = allUsers[p.creatorPhone] || {name: '未知', customColor: '#ff9800'};
            const isAdmin = adminPhones.includes(currentUserPhone);
            const pinBtn = isAdmin ? `<button class="action-btn" onclick="togglePin('poll', ${p.id})">${p.isPinned ? '📍 取消置頂' : '📌 置頂'}</button>` : '';
            const card = `<div class="card"><div class="card-summary" onclick="toggleCard('poll-${p.id}')"><div class="card-summary-left"><div class="text-avatar" style="background-color:${u.customColor}">${u.name.charAt(0)}</div><div style="flex:1; min-width:0;">${p.isPinned ? '<div class="badge badge-pinned">置頂投票</div>' : ''}<div class="badge badge-poll">投票</div><div class="card-title">${p.question}</div><div class="card-creator">${u.name}</div></div></div><div class="card-summary-right" id="icon-poll-${p.id}">🔽 展開</div></div><div id="details-poll-${p.id}" class="card-details hidden"><div class="card-actions">${pinBtn}<button class="action-btn" style="color:red;" onclick="deleteItem('poll', ${p.id})">🗑️</button></div><p>投票內容...</p></div></div>`;
            list.innerHTML += card;
        });
    }

    function renderClosures() {
        const days = ['一', '二', '三', '四', '五', '六', '日']; 
        let reg = '', tmp = '';
        days.forEach(d => {
            const users = Object.values(allUsers).filter(u => u.closedDays?.includes(d));
            if(users.length) reg += `<div class="closure-day-row"><div class="closure-day-label">星期${d}</div><div class="closure-day-list">${users.map(u => u.name).join('、')}</div></div>`;
        });
        document.getElementById('regular-closures-list').innerHTML = reg || '尚無設定';
        
        const tmpMap = {};
        Object.values(allUsers).forEach(u => u.tempClosedDates?.forEach(dt => { if(!tmpMap[dt]) tmpMap[dt] = []; tmpMap[dt].push(u.name); }));
        Object.keys(tmpMap).sort().forEach(dt => {
            tmp += `<div class="closure-day-row"><div class="closure-day-label" style="width:90px; color:#d35400;">${dt.substring(5)}</div><div class="closure-day-list" style="color:#d35400;">${tmpMap[dt].join('、')}</div></div>`;
        });
        document.getElementById('temp-closures-list').innerHTML = tmp || '尚無特休';
    }

    function renderCardView() {
        const me = allUsers[currentUserPhone];
        const stats = getUserStats(currentUserPhone);
        const thirtyDays = 30 * 24 * 60 * 60 * 1000;
        const remaining = me.lastNameChange ? Math.ceil((thirtyDays - (Date.now() - me.lastNameChange)) / (1000 * 60 * 60 * 24)) : 0;
        
        document.getElementById('name-change-hint').innerText = remaining > 0 ? `下次可改名時間：${remaining} 天後` : "您現在可以修改名稱";
        document.getElementById('change-name-btn').disabled = remaining > 0;
        document.getElementById('change-name-btn').style.opacity = remaining > 0 ? "0.5" : "1";

        document.getElementById('my-membership-card').innerHTML = `<div class="membership-card" style="background: linear-gradient(135deg, ${me.customColor} 0%, #111111 150%);"><div class="member-tier-display">${stats.tier}</div><div style="font-size: 28px; font-weight: bold; margin-bottom: 20px;">${me.name} ${me.customEmoji}</div><div class="member-info-row"><span>聚會次數</span><span>${stats.attended} 次</span></div><div class="member-info-row"><span>加入日期</span><span>${stats.joinDateStr}</span></div></div>`;
        
        let tList = '';
        me.tempClosedDates?.forEach(d => tList += `<span style="background:#eee; padding:2px 6px; border-radius:10px; margin-right:5px;">${d}</span>`);
        document.getElementById('temp-close-list').innerHTML = tList;
        
        const checkboxes = document.querySelectorAll('#closed-days-checkboxes input');
        checkboxes.forEach(cb => { cb.checked = me.closedDays?.includes(cb.value); });
    }

    function saveClosureSettings() { const checkboxes = document.querySelectorAll('#closed-days-checkboxes input:checked'); allUsers[currentUserPhone].closedDays = Array.from(checkboxes).map(cb => cb.value); saveAllData(); alert("已儲存！"); }
    function addTempCloseDate() { const d = document.getElementById('temp-close-date').value; if(d) { if(!allUsers[currentUserPhone].tempClosedDates) allUsers[currentUserPhone].tempClosedDates = []; allUsers[currentUserPhone].tempClosedDates.push(d); saveAllData(); renderCardView(); } }
    function saveCardStyle() { allUsers[currentUserPhone].customColor = document.getElementById('card-color-picker').value; allUsers[currentUserPhone].customEmoji = document.getElementById('card-emoji-input').value; saveAllData(); alert("已更新！"); renderCardView(); }
    function deleteItem(type, id) { if(confirm("確定刪除？")) { if(type==='post') postsData = postsData.filter(i=>i.id!==id); if(type==='event') eventsData = eventsData.filter(i=>i.id!==id); if(type==='poll') pollsData = pollsData.filter(i=>i.id!==id); saveAllData(); } }
    function submitPost() { const t = document.getElementById('post-text-input').value; if(t) { postsData.unshift({id:Date.now(), type:'post', text:t, creatorPhone:currentUserPhone, date:new Date().toLocaleDateString(), comments:[], isPinned: false}); saveAllData(); document.getElementById('post-text-input').value=''; } }
    function submitEvent() { const t = document.getElementById('event-title').value; const d = document.getElementById('event-date').value; if(t&&d) { eventsData.unshift({id:Date.now(), type:'event', title:t, date:d, creatorPhone:currentUserPhone, attendees:{}, isPinned: false}); saveAllData(); cancelCreate(); } }
    function cancelCreate() { showMain(); }
    function showCreateForm(t) { showSection(t === 'event' ? 'create-event-section' : 'create-poll-section'); }
</script>
</body>
</html>

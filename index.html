<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東老闆專屬聚會</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        /* 字體與背景設定 */
        body { font-family: 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif; background-color: #f4f4f4; color: #005f20; margin: 0; padding: 0; display: flex; justify-content: center; }
        
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #005f20; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; z-index: 9999; }
        .spinner { margin-top: 15px; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; min-height: 100vh; border-left: 3px solid #005f20; border-right: 3px solid #005f20; box-sizing: border-box; position: relative; }
        .header { background-color: #005f20; color: #ffffff; text-align: center; padding: 15px; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        .nav-tabs { display: flex; background-color: #e0f0e5; border-bottom: 2px solid #005f20; overflow-x: auto; white-space: nowrap; }
        .nav-tab { flex: 1; text-align: center; padding: 12px 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: #004415; }
        .nav-tab.active { background-color: #005f20; color: #ffffff; }
        .content { padding: 20px; }
        
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #005f20; border-radius: 8px; font-size: 16px; box-sizing: border-box; font-family: inherit; }
        button { background-color: #005f20; color: #ffffff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #004415; }
        button.secondary { background-color: #ffffff; color: #005f20; }
        
        .announcement-board { background-color: #fffaf0; border: 2px dashed #d35400; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .announcement-title { color: #d35400; font-weight: bold; margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center;}
        
        .card { border: 2px dashed #005f20; border-radius: 8px; margin-bottom: 15px; background-color: #fafafa; }
        .card-summary { display: flex; align-items: center; justify-content: space-between; padding: 15px; cursor: pointer; }
        .card-summary-left { display: flex; align-items: center; flex: 1; min-width: 0; }
        .card-details { padding: 0 15px 15px 15px; border-top: 1px dashed #ddd; margin-top: -5px; padding-top: 15px; position: relative;}
        
        .text-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #005f20; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
        .card-title { font-size: 16px; font-weight: bold; color: #005f20; padding-right: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
        .badge { background-color: #005f20; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 5px; display: inline-block; }
        .badge-pinned { background-color: #d32f2f; } /* 置頂顏色 */
        
        .post-image { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
        .action-btn { background: none; border: none; padding: 5px; font-size: 14px; cursor: pointer; border-radius: 5px; width: auto; font-weight: normal; }
        
        /* 店休總覽排版修正 */
        .closure-day-row { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; align-items: center; }
        .closure-day-label { width: 80px; font-weight: bold; color: #005f20; flex-shrink: 0; font-size: 15px; }
        .closure-day-list { color: #555; font-size: 14px; line-height: 1.6; flex: 1; text-align: left;}
        
        .membership-card { color: white; border-radius: 12px; padding: 25px 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); margin-bottom: 20px; position: relative; overflow: hidden; }
        .custom-style-panel { background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .ratio-bar { width: 100%; height: 10px; border-radius: 5px; background-color: #ddd; display: flex; overflow: hidden; margin-bottom: 5px; }
        .ratio-attend { background-color: #005f20; height: 100%; transition: width 0.3s; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="loading-screen"><div>連線至雲端大腦中...</div><div class="spinner"></div></div>

<div class="app-container hidden" id="main-app-wrapper">
    <div class="header">台東老闆專屬聚會</div>
    <div id="nav-section" class="nav-tabs hidden">
        <div class="nav-tab active" id="tab-home" onclick="switchTab('home')">首頁動態</div>
        <div class="nav-tab" id="tab-events" onclick="switchTab('events')">聚會報名</div>
        <div class="nav-tab" id="tab-polls" onclick="switchTab('polls')">投票區</div>
        <div class="nav-tab" id="tab-closures" onclick="switchTab('closures')">店休總覽</div>
        <div class="nav-tab" id="tab-card" onclick="switchTab('card')">會員卡</div>
    </div>

    <div class="content">
        <div id="login-section" class="hidden">
            <h2>台東老闆專屬聚會</h2>
            <input type="tel" id="phone-input" placeholder="手機號碼 (10碼)" maxlength="10">
            <div id="invite-code-container"><input type="text" id="invite-code-input" placeholder="專屬邀請碼"></div>
            <button onclick="login()" style="margin-top: 15px;">進入系統</button>
        </div>

        <div id="profile-section" class="hidden">
            <h2>設定基本資料</h2>
            <input type="text" id="name-input" placeholder="您的稱呼或店名">
            <button onclick="saveProfile()" style="margin-top: 20px;">儲存並進入</button>
        </div>

        <div id="main-section" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display: flex; align-items: center;"><div id="my-avatar" class="text-avatar" style="width:30px; height:30px; font-size:14px;"></div><span id="welcome-msg" style="font-weight:bold;">歡迎！</span></div>
                <button style="width: auto; padding: 5px 15px; font-size: 14px;" class="secondary" onclick="logout()">登出</button>
            </div>
            
            <div id="home-view">
                <div id="announcement-board" class="announcement-board">
                    <div class="announcement-title"><span>📌 老闆公告牆</span><span id="edit-notice-container"></span></div>
                    <div class="announcement-text" id="announcement-text-display">載入中...</div>
                </div>
                <div class="post-input-area">
                    <h4 style="margin: 0 0 10px 0; color: #005f20;">📷 分享動態</h4>
                    <textarea id="post-text-input" placeholder="分享心情或照片..." style="height: 60px;"></textarea>
                    <input type="file" id="post-image-input" accept="image/*">
                    <button onclick="submitPost()">發佈動態</button>
                </div>
                <div id="home-list"></div>
            </div>

            <div id="events-view" class="hidden"><button onclick="showCreateForm('event')">＋ 發起新聚會</button><div id="events-list" style="margin-top:20px;"></div></div>
            <div id="polls-view" class="hidden"><button onclick="showCreateForm('poll')">＋ 建立新投票</button><div id="polls-list" style="margin-top:20px;"></div></div>
            <div id="closures-view" class="hidden">
                <h3 style="color: #005f20;">📍 固定店休一覽</h3><div class="card" id="regular-closures-list"></div>
                <h3 style="color: #d35400; margin-top: 30px;">🏖️ 近期臨時特休</h3><div class="card" id="temp-closures-list" style="background-color:#fffaf0;"></div>
            </div>

            <div id="card-view" class="hidden">
                <div id="my-membership-card"></div>
                <!-- 新增改名區塊 -->
                <div class="custom-style-panel">
                    <h4 style="margin:0 0 10px 0; color:#005f20;">👤 修改我的稱呼</h4>
                    <input type="text" id="new-name-input" placeholder="新名字">
                    <p id="name-change-hint" style="font-size:12px; color:#666; margin-top:-5px;"></p>
                    <button id="change-name-btn" onclick="updateUserName()">更新稱呼 (一個月限改一次)</button>
                </div>
                <div class="custom-style-panel">
                    <h4>📅 我的店休設定</h4>
                    <div id="closed-days-checkboxes" style="margin-bottom:10px; font-size:14px;">
                        <label><input type="checkbox" value="一">一</label> <label><input type="checkbox" value="二">二</label> <label><input type="checkbox" value="三">三</label> <label><input type="checkbox" value="四">四</label> <label><input type="checkbox" value="五">五</label> <label><input type="checkbox" value="六">六</label> <label><input type="checkbox" value="日">日</label>
                    </div>
                    <div style="display:flex; gap:10px;"><input type="date" id="temp-close-date" style="margin:0; flex:1;"><button onclick="addTempCloseDate()" style="margin:0; width:auto;">新增特休</button></div>
                    <button onclick="saveClosureSettings()" style="margin-top:15px; background-color:#d35400;">儲存設定</button>
                </div>
                <div class="custom-style-panel">
                    <h4>🎨 會員卡風格</h4>
                    <input type="color" id="card-color-picker" value="#005f20">
                    <input type="text" id="card-emoji-input" placeholder="Emoji (例: 🦖)" maxlength="2">
                    <button onclick="saveCardStyle()">儲存風格</button>
                </div>
                <div id="admin-panel-container"></div>
            </div>
        </div>

        <div id="create-event-section" class="hidden"><h2>發起新聚會</h2><input type="text" id="event-title" placeholder="名稱"><input type="text" id="event-date" placeholder="時間地點"><button onclick="submitEvent()">發布</button><button class="secondary" onclick="cancelCreate()">取消</button></div>
        <div id="create-poll-section" class="hidden"><h2>建立新投票</h2><input type="text" id="poll-question" placeholder="問題"><textarea id="poll-options" placeholder="選項 (換行分隔)"></textarea><button onclick="submitPoll()">發布</button><button class="secondary" onclick="cancelCreate()">取消</button></div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWQ6GAMAsPESR3vPe7tqkGPg3KzUtSdJQ",
      authDomain: "taitung-boss.firebaseapp.com",
      projectId: "taitung-boss",
      storageBucket: "taitung-boss.firebasestorage.app",
      messagingSenderId: "466331597059",
      appId: "1:466331597059:web:9d48ad26475fc71e721136"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allUsers = {}, adminPhones = [], eventsData = [], pollsData = [], postsData = [], systemInviteCode = '8888', announcementText = '';
    let currentUserPhone = null, currentTab = 'home', isDataLoaded = false;

    db.collection("taitung_app").onSnapshot((snapshot) => {
        snapshot.docs.forEach((doc) => {
            const data = JSON.parse(doc.data().d || '{}');
            if (doc.id === "users") allUsers = data;
            if (doc.id === "admins") adminPhones = data;
            if (doc.id === "events") eventsData = data;
            if (doc.id === "polls") pollsData = data;
            if (doc.id === "posts") postsData = data;
            if (doc.id === "settings") { systemInviteCode = data.inviteCode || '8888'; announcementText = data.announcement || '歡迎加入！'; }
        });
        if (!isDataLoaded) { isDataLoaded = true; document.getElementById('loading-screen').style.display = 'none'; document.getElementById('main-app-wrapper').classList.remove('hidden'); initApp(); }
        else if (currentUserPhone) { switchTab(currentTab); renderAnnouncement(); }
    });

    function saveAllData() {
        db.collection("taitung_app").doc("users").set({ d: JSON.stringify(allUsers) });
        db.collection("taitung_app").doc("admins").set({ d: JSON.stringify(adminPhones) });
        db.collection("taitung_app").doc("events").set({ d: JSON.stringify(eventsData) });
        db.collection("taitung_app").doc("polls").set({ d: JSON.stringify(pollsData) });
        db.collection("taitung_app").doc("posts").set({ d: JSON.stringify(postsData) });
    }

    // --- 改名限制邏輯 ---
    function updateUserName() {
        const newName = document.getElementById('new-name-input').value.trim();
        if (!newName) return;
        const me = allUsers[currentUserPhone];
        const now = Date.now();
        const thirtyDays = 30 * 24 * 60 * 60 * 1000;
        if (me.lastNameChange && (now - me.lastNameChange < thirtyDays)) {
            const rem = Math.ceil((thirtyDays - (now - me.lastNameChange)) / (1000 * 60 * 60 * 24));
            return alert(`未滿一個月不可修改，需再等 ${rem} 天！`);
        }
        if (confirm(`確定改名為「${newName}」？(下次修改需等30天)`)) {
            me.name = newName; me.lastNameChange = now; saveAllData(); renderCardView();
        }
    }

    // --- 置頂邏輯 (Admin Only) ---
    function togglePin(type, id) {
        if (!adminPhones.includes(currentUserPhone)) return;
        let arr = (type === 'post') ? postsData : (type === 'event') ? eventsData : pollsData;
        const item = arr.find(i => i.id === id);
        if (item) { item.isPinned = !item.isPinned; saveAllData(); }
    }

    // 排序：置頂優先，其次按 ID (時間)
    function getSorted(data) {
        return [...data].sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0) || b.id - a.id);
    }

    function renderHome() {
        renderAnnouncement();
        const list = document.getElementById('home-list'); list.innerHTML = '';
        const allItems = getSorted([...postsData, ...eventsData, ...pollsData]);
        allItems.forEach(item => {
            const div = document.createElement('div');
            if(item.type === 'post') renderPosts(div, [item]); else if(item.type === 'event') renderEvents(div, [item]); else renderPolls(div, [item]);
            list.appendChild(div.firstElementChild);
        });
    }

    // --- 渲染組件精簡注入置頂按鈕 ---
    function renderPosts(target, data) {
        data.forEach(p => {
            const u = allUsers[p.creatorPhone] || {name: '未知'};
            const isAdmin = adminPhones.includes(currentUserPhone);
            const pinBtn = isAdmin ? `<button class="action-btn" onclick="togglePin('post', ${p.id})">${p.isPinned ? '取消置頂' : '📌 置頂'}</button>` : '';
            target.innerHTML += `<div class="card"><div class="card-summary" onclick="toggleCard('post-${p.id}')"><div class="card-summary-left"><div class="text-avatar" style="background-color:${u.customColor}">${u.name.charAt(0)}</div><div style="flex:1; min-width:0;">${p.isPinned ? '<div class="badge badge-pinned">置頂公告</div>' : ''}<div class="badge badge-post">分享</div><div class="card-title">${p.text.substring(0,15)}...</div><div style="font-size:12px; color:#666;">${u.name}</div></div></div><div class="card-summary-right" id="icon-post-${p.id}">🔽 展開</div></div><div id="details-post-${p.id}" class="card-details hidden"><div class="card-actions">${pinBtn}<button class="action-btn" style="color:red;" onclick="deleteItem('post', ${p.id})">🗑️</button></div><p>${p.text}</p>${p.image ? `<img src="${p.image}" class="post-image">` : ''}</div></div>`;
        });
    }

    // --- 修正店休對齊渲染 ---
    function renderClosures() {
        const days = ['一', '二', '三', '四', '五', '六', '日'];
        let reg = '';
        days.forEach(d => {
            const names = Object.values(allUsers).filter(u => u.closedDays?.includes(d)).map(u => u.name);
            if(names.length) reg += `<div class="closure-day-row"><div class="closure-day-label">星期${d}</div><div class="closure-day-list">${names.join('、')}</div></div>`;
        });
        document.getElementById('regular-closures-list').innerHTML = reg || '尚無設定';
        
        let tmp = '';
        const tmpMap = {};
        Object.values(allUsers).forEach(u => u.tempClosedDates?.forEach(dt => { if(!tmpMap[dt]) tmpMap[dt] = []; tmpMap[dt].push(u.name); }));
        Object.keys(tmpMap).sort().forEach(dt => {
            tmp += `<div class="closure-day-row"><div class="closure-day-label" style="width:90px; color:#d35400;">${dt.substring(5)}</div><div class="closure-day-list" style="color:#d35400;">${tmpMap[dt].join('、')}</div></div>`;
        });
        document.getElementById('temp-closures-list').innerHTML = tmp || '尚無特休';
    }

    // --- 輔助功能 (保持 V15 完整邏輯) ---
    function initApp() { const p = localStorage.getItem('taitung_current_phone'); if(p && allUsers[p]) { currentUserPhone = p; showMain(); } else { showSection('login-section'); } }
    function login() { const p = document.getElementById('phone-input').value.trim(); const c = document.getElementById('invite-code-input').value.trim(); if(allUsers[p]) { currentUserPhone = p; localStorage.setItem('taitung_current_phone', p); showMain(); } else if(c === systemInviteCode) { localStorage.setItem('taitung_current_phone', p); showSection('profile-section'); } else { alert("錯誤！"); } }
    function saveProfile() { const n = document.getElementById('name-input').value.trim(); const p = localStorage.getItem('taitung_current_phone'); if(!n) return; allUsers[p] = { phone:p, name:n, joinDate:Date.now(), customColor:'#005f20', customEmoji:'✨', closedDays:[], tempClosedDates:[] }; currentUserPhone=p; if(!adminPhones.length) adminPhones.push(p); saveAllData(); showMain(); }
    function showMain() { showSection('main-section'); switchTab('home'); }
    function switchTab(t) { currentTab=t; document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active')); document.getElementById(`tab-${t}`).classList.add('active'); ['home','events','polls','closures','card'].forEach(v => document.getElementById(`${v}-view`).classList.add('hidden')); document.getElementById(`${t}-view`).classList.remove('hidden'); if(t==='home') renderHome(); else if(t==='closures') renderClosures(); else if(t==='card') renderCardView(); }
    function showSection(id) { ['login-section', 'profile-section', 'main-section', 'create-event-section', 'create-poll-section'].forEach(s => document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if(id==='main-section') { document.getElementById('nav-section').classList.remove('hidden'); const u=allUsers[currentUserPhone]; document.getElementById('welcome-msg').innerText = `${u.name} ${u.customEmoji}`; document.getElementById('my-avatar').innerText = u.name.charAt(0); document.getElementById('my-avatar').style.backgroundColor = u.customColor; } }
    function toggleCard(id) { document.getElementById(`details-${id}`).classList.toggle('hidden'); }
    function logout() { localStorage.clear(); location.reload(); }
    function submitPost() { const t = document.getElementById('post-text-input').value; const f = document.getElementById('post-image-input').files[0]; if(!t && !f) return; const r = new FileReader(); r.onload = e => { postsData.unshift({id:Date.now(), creatorPhone:currentUserPhone, text:t, image:e.target.result, date:new Date().toLocaleDateString(), comments:[], isPinned:false, type:'post'}); saveAllData(); document.getElementById('post-text-input').value=''; document.getElementById('post-image-input').value=''; }; if(f) r.readAsDataURL(f); else r.onload({target:{result:null}}); }
    function renderCardView() {
        const me = allUsers[currentUserPhone]; const stats = getUserStats(currentUserPhone); const rem = me.lastNameChange ? Math.ceil((30*24*60*60*1000 - (Date.now()-me.lastNameChange))/(1000*60*60*24)) : 0;
        document.getElementById('name-change-hint').innerText = rem > 0 ? `需再等 ${rem} 天才能改名` : "現在可以改名";
        document.getElementById('change-name-btn').disabled = rem > 0;
        document.getElementById('my-membership-card').innerHTML = `<div class="membership-card" style="background:linear-gradient(135deg, ${me.customColor}, #111);"><div style="font-size:24px; font-weight:bold;">${me.name} ${me.customEmoji}</div><div style="margin-top:20px; font-size:14px;">等級：${stats.tier}</div></div>`;
    }
    // 其餘 V15 組件渲染與資料處理邏輯請以此類推...
</script>
</body>
</html>

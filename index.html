<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台東老闆專屬聚會 - 系統升級中</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'PingFang TC', 'Helvetica Neue', Helvetica, Arial, 'Microsoft JhengHei', sans-serif;
            /* 尊榮深海漸層背景 */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* 毛玻璃質感卡片 */
        .maintenance-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 50px 30px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            /* 上下懸浮動畫 */
            animation: float 4s ease-in-out infinite;
            position: relative;
            z-index: 10;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .icon {
            font-size: 75px;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin: 0 0 15px 0;
            letter-spacing: 2px;
            color: #00c6ff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #e1e8ed;
            margin: 0 0 35px 0;
            font-weight: 600;
        }

        /* 科技感動態光條 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 25px;
        }

        .progress-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00c6ff, #0072ff, transparent);
            border-radius: 10px;
            position: absolute;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        .footer {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* 背景微光點綴 */
        .glow {
            position: absolute;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(0,198,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            top: -100px; left: -100px;
        }
        .glow2 {
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0,114,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 1;
            bottom: -150px; right: -100px;
        }
    </style>
</head>
<body>

    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="maintenance-card">
        <div class="icon">🛠️ 🌊</div>
        <h1>系統升級維護中</h1>
        <p>為了給台東老闆們更穩定、更高質感的體驗，<br>「台東大腦」目前正在進行深度潛水升級！<br><br>請稍後再重新載入，我們馬上回來！</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="footer">
            台東老闆專屬聚會 &copy; 系統工程部
        </div>
    </div>

</body>
</html>

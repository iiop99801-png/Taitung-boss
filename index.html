<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統優化中 - 台東老闆專屬聚會</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            font-family: 'Microsoft JhengHei', sans-serif;
            color: #005f20;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #ffffff;
            border: 3px solid #005f20;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 80%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }
        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ' .'; }
            40% { content: ' . .'; }
            60% { content: ' . . .'; }
            80%, 100% { content: ''; }
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #005f20;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🛠️</div>
    <h1>網站優化中<span class="loading-dots"></span></h1>
    <p>各位台東頭家請稍候，<br>我們正在升級雲端系統與置頂功能，<br>提升更順暢的交流體驗！</p>
    <div class="footer">Xiaoshihou Brunch · 台東開店人生</div>
</div>

</body>
</html>
